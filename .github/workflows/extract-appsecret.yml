name: extract-appsecret

# 手动触发。在 GitHub 托管 ubuntu-latest（x86_64）runner 上从零完成提取，
# 全程无人值守：复用 runner 预装的 adb/JDK，自动下载钉住的 emulator
# 31.3.10（build 8807927，约 280MB）与 arm64-v8a API33 系统镜像（约
# 1.7GB，镜像 ABI 恒为 arm64——领克 APK 仅含 arm64 原生库）及最新 APK
# -> 无头冷启动 -> 断点提取 -> 写 env.json。
# 为何钉住 31.3.10：与 API33 镜像同代。跨架构硬检查（arm64 guest
# 且 apiLevel≥28 才拒）在 37.x 与 31.x 都存在，脚本靠 AVD 根 ini
# 谎报 target=android-27 绕过（apiLevel 只从该字段解析，镜像仍是
# API33，本地实测同版 31.3.10 正常 boot）。qemu-system-aarch64
# 对 arm64 镜像做全系统 TCG 模拟——整个 guest 就是 arm64 Android，
# App 的加固壳跑真 ARM64 指令（逐条翻译），无 libndk 翻译层、不会
# 崩溃；代价是慢（冷启动 20~50 分钟），故 timeout 180 分钟。
# 已排除的路线（2026-08-31 实测）：ubuntu+x86_64 镜像（libndk 下加固壳
# 必崩）；macos runner（VM 无 Hypervisor.framework，且 Android emulator
# 的 arm64 guest 在 macOS 上死绑 HVF、无法降级 TCG）。
# 另配置 LYNKCO_PAT Secret（需具备本仓库 Secret 写权限）时，提取结果会
# 自动合并更新仓库 Secret LYNKCO_APP_SECRETS，免去手动复制。
on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 提取 AppSecret（arm64 镜像 TCG 全系统模拟 -> 冷启动 -> 断点提取）
        env:
          EMU_HEADLESS: "1"        # 无头模式（无 DISPLAY 时脚本也会自动切换）
          LYNKCO_AUTO_WRITE: "1"   # 免交互确认，自动写入 env.json
        run: python3 LynkCoHelper/tools/extract_appsecret_auto.py

      - name: 同步更新仓库 Secret LYNKCO_APP_SECRETS
        env:
          GH_TOKEN: ${{ secrets.LYNKCO_PAT }}             # 未配置则跳过
          MERGED_FROM: ${{ secrets.LYNKCO_APP_SECRETS }}  # 现有值，保留未变更字段
        run: |
          python3 - <<'EOF'
          import json, os, subprocess
          if not os.environ.get("GH_TOKEN"):
              print("[*] 未配置 LYNKCO_PAT，跳过自动同步")
              raise SystemExit(0)
          merged = {}
          try:
              merged.update(json.loads(os.environ.get("MERGED_FROM", "")))
          except Exception:
              pass  # 现有值缺失/格式异常时，以本次提取结果为准
          # 读取上一步脚本写入的 env.json（CI 内的临时数据通道，runner 销毁即丢弃）
          with open("LynkCoHelper/env.json", encoding="utf-8") as f:
              merged.update(json.load(f).get("secrets", {}))
          subprocess.run(["gh", "secret", "set", "LYNKCO_APP_SECRETS",
                          "--repo", os.environ["GITHUB_REPOSITORY"],
                          "--body", json.dumps(merged, ensure_ascii=False)],
                         check=True)
          print(f"[+] LYNKCO_APP_SECRETS 已更新（{len(merged)} 个字段）")
          EOF
