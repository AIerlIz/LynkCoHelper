name: extract-appsecret

# 手动触发。在 GitHub 托管 ubuntu-latest（x86_64，自带 /dev/kvm）上
# 从零完成提取，全程无人值守：自动下载 emulator + x86_64 API33 系统镜像
# （google_apis）+ 最新 APK -> 无头冷启动（KVM 加速，约 2~5 分钟）
# -> 断点提取 -> 写 env.json。
# 为何默认 x86_64 镜像（2026-09-06 实测，详见 docs/本地一键提取指南.md
# 第 2 节）：arm64 镜像路线不可救——arm64 ranchu 虚拟机没有 PCI 总线，
# 而 31.3.10/36.2.12 的 qemu fork 会无条件初始化 virtio-snd-pci，
# "PCI bus not available" 直接致命且无参数可绕。x86_64 镜像下加固壳的
# arm64 原生库经 libndk 翻译执行，可存活到 <clinit>，本地（WSL2+KVM）
# 已实测跑通。ABI 已写死 x86_64（脚本缺省 arm64-v8a 的路线已证实不可行）。
# 提取结果仅存在于本次运行的 env.json（runner 销毁即丢），通过一次性链接
# 送达：链接打印在运行日志里，仅可打开 1 次、10 分钟后失效（阅后即焚，
# api.cloudcpp.com 托管，国内直连友好）。链接本身随公开日志可见，已确认
# 不依赖链接保密性。
on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 开放 KVM 权限（模拟器加速用）
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::runner 无 /dev/kvm，将退化为纯软件模拟（x86_64 镜像下仍可运行，只是慢）"
          fi

      - name: 提取 AppSecret（x86_64 镜像 + KVM -> 冷启动 -> 断点提取）
        id: extract
        env:
          EMU_HEADLESS: "1"        # 无头模式（无 DISPLAY 时脚本也会自动切换）
          LYNKCO_AUTO_WRITE: "1"   # 免交互确认，自动写入 env.json
          LYNKCO_IMAGE_ABI: "x86_64"  # 写死（脚本缺省是 arm64-v8a，该路线已证实不可行；勿删）
        run: python3 LynkCoHelper/tools/extract_appsecret_github_action.py

      # 模拟器排障三件套：宿主磁盘/内存/内核日志（OOM killer 发 SIGKILL
      # 只能从 dmesg 看到；磁盘爆盘 qemu 初始化即死且报错晦涩）
      - name: 失败诊断（磁盘/内存/内核日志）
        if: failure()
        run: |
          echo "=== df -h ==="; df -h || true
          echo "=== free -h ==="; free -h || true
          echo "=== dmesg 末尾（看 OOM killer）==="; sudo dmesg 2>/dev/null | tail -40 || true

      - name: 上传模拟器完整日志（失败诊断）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-log
          path: /home/runner/.lynkco-helper-tools/emulator.log
          if-no-files-found: ignore

      - name: 生成一次性取件链接（阅后即焚：仅可打开 1 次，10 分钟后失效）
        if: success()
        run: |
          python3 - <<'EOF'
          import json, time, urllib.parse, urllib.request

          with open("LynkCoHelper/env.json", encoding="utf-8") as f:
              sec = json.load(f).get("secrets", {})
          key = sec.get("nativeAppKey", "")
          secret = sec.get("nativeAppSecret", "")
          if not (key and secret):
              print("[!] env.json 中未找到密钥，跳过一次性链接生成")
              raise SystemExit(0)

          # api.cloudcpp.com（API Center 阅后即焚，国内直连友好）：
          # ttl=600 秒兜底过期，链接被打开 1 次后内容即焚毁。
          # 需 Accept: application/json（缺失则返回 HTML 表单页）；带重试。
          data = urllib.parse.urlencode({
              "content": f"nativeAppKey: {key}\n"
                         f"nativeAppSecret: {secret}",
              "ttl": "600",
          }).encode()
          r = None
          for attempt in range(3):
              req = urllib.request.Request(
                  "https://api.cloudcpp.com/burn", data=data, method="POST",
                  headers={"User-Agent": "LynkCoHelper-extract/1.0",
                           "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      r = json.load(resp)
                  break
              except Exception as e:
                  print(f"[!] 第 {attempt + 1} 次请求失败: {e}")
                  if attempt < 2:
                      time.sleep(5)
          if not r or not r.get("link"):
              print("[!] 一次性链接生成失败，env.json 已随 runner 销毁，"
                    "请重跑 workflow 或改用本地提取")
              raise SystemExit(1)
          print("[+] 一次性取件链接（仅可打开 1 次，10 分钟后失效）：")
          print(f"    {r['link']}")
          EOF
