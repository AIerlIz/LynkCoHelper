name: extract-appsecret

# 手动触发。在 GitHub 托管 macos-latest（Apple Silicon arm64）runner 上从零
# 完成提取，全程无人值守：复用 runner 预装的 adb/JDK；预装 emulator 是
# x86_64 包（无法承载 arm64 guest，启动即 "Could not launch .../qemu/
# darwin-x86_64/qemu-system-aarch64"），脚本会自下载 darwin_aarch64 原生
# emulator + arm64-v8a API34 系统镜像与最新 APK -> 无头冷启动 -> 断点提取
# -> 写 env.json。
# 为何必须 arm64 runner：领克 APK 仅含 arm64-v8a 原生库，x86_64 模拟器靠
# libndk 翻译执行 ARM 代码时其加固壳必崩（SIGSEGV，2026-08-31 ubuntu runner
# 实测），故 ubuntu-latest 路线已弃用。
# 加速说明：GitHub macOS arm runner 是 VM，guest 内无 Hypervisor.framework
# （官方确认短期无解，actions/runner-images#13505），脚本检测到后自动降级
# qemu TCG 软件模拟（-accel off，boot 超时放宽到 20 分钟）。
# 另配置 LYNKCO_PAT Secret（需具备本仓库 Secret 写权限）时，提取结果会
# 自动合并更新仓库 Secret LYNKCO_APP_SECRETS，免去手动复制。
on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 提取 AppSecret（自备 arm64 emulator+镜像 -> 冷启动 -> 断点提取）
        env:
          EMU_HEADLESS: "1"        # 无头模式（无 DISPLAY 时脚本也会自动切换）
          LYNKCO_AUTO_WRITE: "1"   # 免交互确认，自动写入 env.json
        run: python3 LynkCoHelper/tools/extract_appsecret_auto.py

      - name: 同步更新仓库 Secret LYNKCO_APP_SECRETS
        env:
          GH_TOKEN: ${{ secrets.LYNKCO_PAT }}             # 未配置则跳过
          MERGED_FROM: ${{ secrets.LYNKCO_APP_SECRETS }}  # 现有值，保留未变更字段
        run: |
          python3 - <<'EOF'
          import json, os, subprocess
          if not os.environ.get("GH_TOKEN"):
              print("[*] 未配置 LYNKCO_PAT，跳过自动同步")
              raise SystemExit(0)
          merged = {}
          try:
              merged.update(json.loads(os.environ.get("MERGED_FROM", "")))
          except Exception:
              pass  # 现有值缺失/格式异常时，以本次提取结果为准
          # 读取上一步脚本写入的 env.json（CI 内的临时数据通道，runner 销毁即丢弃）
          with open("LynkCoHelper/env.json", encoding="utf-8") as f:
              merged.update(json.load(f).get("secrets", {}))
          subprocess.run(["gh", "secret", "set", "LYNKCO_APP_SECRETS",
                          "--repo", os.environ["GITHUB_REPOSITORY"],
                          "--body", json.dumps(merged, ensure_ascii=False)],
                         check=True)
          print(f"[+] LYNKCO_APP_SECRETS 已更新（{len(merged)} 个字段）")
          EOF
