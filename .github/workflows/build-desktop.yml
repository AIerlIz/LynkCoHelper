name: Build desktop assistant
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r desktop/requirements.lock
      - run: python -m unittest discover -s tests/desktop -v
      - run: python desktop/packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: LynkCoHelper-${{ matrix.os }}
          path: dist/
          retention-days: 7
