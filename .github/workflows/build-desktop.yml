name: Build desktop assistant
on:
  push:
    tags:
      - 'cloud-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version, for example cloud-v0.1.0'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^cloud-v[0-9][A-Za-z0-9._-]*$ ]] || exit 1
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Use a new release tag; existing versions must not be overwritten.'
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-14
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r desktop/requirements.lock
      - run: python -m unittest discover -s desktop/tests -v
      - run: python desktop/packaging/build.py
      - run: python desktop/packaging/build_release.py --tag "$RELEASE_TAG" --platform "$PLATFORM"
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PLATFORM: ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: LynkCoHelper-cloud-${{ matrix.platform }}
          path: release/
          retention-days: 7
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: LynkCoHelper-cloud-*
          merge-multiple: true
          path: release
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          assets=()
          while IFS= read -r -d '' asset; do assets+=("$asset"); done < <(find release -maxdepth 1 -type f -print0)
          ((${#assets[@]} > 0)) || { echo 'No release files found'; exit 1; }
          gh release create "$RELEASE_TAG" "${assets[@]}" --target "$SOURCE_SHA" --title "LynkCoHelper $RELEASE_TAG" --generate-notes
